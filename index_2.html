<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalogo prodotti per animali</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E2420;
    --ink-soft:#4B564E;
    --paper:#EFE7D6;
    --paper-deep:#E4DAC3;
    --card:#FBF8F0;
    --line:#D8CBAA;
    --pine:#2F4B3E;
    --pine-deep:#22392F;
    --gold:#B9822E;
    --gold-soft:#E4C482;
    --red:#9C4B3E;
    --green-ok:#4C7A5B;
    --shadow: 0 1px 0 rgba(30,36,32,0.05), 0 6px 16px rgba(30,36,32,0.06);
    --radius: 3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(30,36,32,0.015) 1px, transparent 1px);
    background-size: 100% 28px;
    pointer-events:none;
    z-index:0;
  }
  ::selection{ background:var(--gold-soft); }

  a{color:inherit;}
  button{font-family:inherit;}

  .mono{font-family:'IBM Plex Mono', monospace;}

  /* ---------- App shell ---------- */
  #app{position:relative; z-index:1; display:flex; min-height:100vh;}

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:264px; flex:0 0 264px;
    background:var(--paper-deep);
    border-right:1px solid var(--line);
    padding:22px 0 40px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
    display:flex; flex-direction:column;
  }
  .brand{
    padding:0 20px 18px;
    border-bottom:1px solid var(--line);
    margin-bottom:14px;
  }
  .brand .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--gold); font-weight:600;
  }
  .brand h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:21px;
    margin:4px 0 0;
    color:var(--pine-deep);
    letter-spacing:-0.01em;
  }
  .brand .sub{
    font-size:11.5px; color:var(--ink-soft); margin-top:5px;
  }

  .cat-nav{padding:0 10px; flex:1;}
  .cat-item{ margin-bottom:1px; }
  .cat-row{
    display:flex; align-items:center; gap:8px;
    padding:8px 10px; border-radius:var(--radius);
    cursor:pointer; user-select:none;
    font-size:13px;
  }
  .cat-row:hover{ background:rgba(47,75,62,0.08); }
  .cat-row.active{ background:var(--pine); color:#F4F0E2; }
  .cat-row.active .cat-count{ color:#EAD9AE; }
  .cat-row .chevron{
    width:9px; height:9px; flex:0 0 9px;
    border-right:1.5px solid var(--ink-soft);
    border-bottom:1.5px solid var(--ink-soft);
    transform:rotate(-45deg);
    transition:transform .15s ease;
    margin-left:2px;
  }
  .cat-row.active .chevron{ border-color:#F4F0E2; }
  .cat-item.open > .cat-row .chevron{ transform:rotate(45deg); }
  .cat-row .name{ flex:1; }
  .cat-count{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; color:var(--ink-soft);
  }
  .sub-list{ display:none; padding-left:19px; }
  .cat-item.open > .sub-list{ display:block; }
  .sub-row{
    display:flex; justify-content:space-between; gap:8px;
    padding:6px 10px; border-radius:var(--radius);
    font-size:12.5px; cursor:pointer; color:var(--ink-soft);
  }
  .sub-row:hover{ background:rgba(47,75,62,0.08); color:var(--ink); }
  .sub-row.active{ background:var(--gold-soft); color:var(--pine-deep); font-weight:500; }

  .sidebar-foot{
    padding:16px 20px 0; margin-top:16px; border-top:1px solid var(--line);
  }
  .tally{
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft);
    display:flex; justify-content:space-between; margin-top:10px;
  }

  /* ---------- Main ---------- */
  #main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  #topbar{
    position:sticky; top:0; z-index:5;
    background:var(--paper); border-bottom:1px solid var(--line);
    padding:16px 28px; display:flex; gap:14px; align-items:center;
    flex-wrap:wrap;
  }
  .search-wrap{
    flex:1; min-width:220px; position:relative;
  }
  .search-wrap input{
    width:100%; padding:10px 14px 10px 34px;
    border:1px solid var(--line); border-radius:var(--radius);
    background:var(--card); font-size:13.5px; color:var(--ink);
    outline:none;
  }
  .search-wrap input:focus{ border-color:var(--pine); }
  .search-wrap svg{
    position:absolute; left:11px; top:50%; transform:translateY(-50%);
    width:14px; height:14px; opacity:.5;
  }
  .btn{
    border:1px solid var(--line); background:var(--card);
    color:var(--ink); padding:9px 14px; border-radius:var(--radius);
    font-size:13px; cursor:pointer; white-space:nowrap;
    transition:background .12s ease, border-color .12s ease;
  }
  .btn:hover{ border-color:var(--pine); }
  .btn.primary{
    background:var(--pine); color:#F4F0E2; border-color:var(--pine);
  }
  .btn.primary:hover{ background:var(--pine-deep); }

  #crumb{
    padding:16px 28px 4px; font-size:12px; color:var(--ink-soft);
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  }
  #crumb b{ color:var(--pine-deep); font-weight:600; }
  #crumb .count-badge{
    font-family:'IBM Plex Mono', monospace; background:var(--gold-soft);
    color:var(--pine-deep); padding:1px 7px; border-radius:20px; font-size:11px;
  }

  #grid{
    padding:14px 28px 40px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(258px, 1fr));
    gap:14px;
    flex:1;
  }

  .card{
    background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    display:flex; overflow:hidden; cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .card:hover{ transform:translateY(-2px); box-shadow:0 10px 22px rgba(30,36,32,0.10); }
  .card .tab{
    flex:0 0 26px; background:var(--pine);
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .card .tab span{
    writing-mode:vertical-rl; text-orientation:mixed;
    font-family:'IBM Plex Mono', monospace; font-size:9.5px;
    color:#EAD9AE; letter-spacing:.04em; font-weight:600;
    max-height:100%; overflow:hidden; text-overflow:ellipsis;
  }
  .card .body{ flex:1; min-width:0; padding:12px 14px; }
  .card .thumb-img{
    width:100%; height:128px; object-fit:cover; display:block;
    border-radius:2px; margin-bottom:9px; border:1px solid var(--line);
    background:var(--paper-deep);
  }
  .card .row1{
    display:flex; justify-content:space-between; align-items:baseline;
    gap:8px; margin-bottom:6px;
  }
  .card .code{
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--gold);
    font-weight:600;
  }
  .card .name{
    font-family:'Fraunces', serif; font-weight:600; font-size:15.5px;
    color:var(--pine-deep); line-height:1.28; margin-bottom:8px;
    overflow-wrap:anywhere;
  }
  .card .meta{
    display:flex; flex-wrap:wrap; gap:5px; font-size:10.5px;
  }
  .chip{
    background:var(--paper-deep); border:1px solid var(--line);
    color:var(--ink-soft); padding:2px 7px; border-radius:20px;
  }

  #empty{
    padding:80px 28px; text-align:center; color:var(--ink-soft);
  }
  #empty h3{ font-family:'Fraunces', serif; font-size:20px; color:var(--pine-deep); margin-bottom:6px;}

  /* ---------- Footer ---------- */
  #siteFooter{
    border-top:1px solid var(--line);
    background:var(--paper-deep);
    padding:26px 28px;
    display:flex; flex-wrap:wrap; gap:22px 40px; align-items:center;
    justify-content:space-between;
  }
  #siteFooter .foot-brand{
    font-family:'Fraunces', serif; font-size:15px; color:var(--pine-deep); font-weight:600;
  }
  #siteFooter .foot-contacts{
    display:flex; flex-wrap:wrap; gap:22px;
  }
  .foot-item{
    display:flex; align-items:center; gap:9px; font-size:13px; color:var(--ink);
    text-decoration:none;
  }
  .foot-item .ico{
    width:30px; height:30px; border-radius:50%; background:var(--pine);
    display:flex; align-items:center; justify-content:center; flex:0 0 30px;
  }
  .foot-item .ico svg{ width:15px; height:15px; fill:#F4F0E2; }
  .foot-item .label{ font-size:10.5px; color:var(--ink-soft); display:block; }
  .foot-item .value{ font-weight:500; }
  .foot-item.link:hover .value{ color:var(--pine-deep); text-decoration:underline; }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(30,36,32,0.45);
    display:none; align-items:flex-start; justify-content:center;
    padding:6vh 20px; z-index:50; overflow-y:auto;
  }
  .overlay.show{ display:flex; }
  .modal{
    background:var(--card); border-radius:6px; width:100%; max-width:560px;
    box-shadow:0 24px 60px rgba(0,0,0,0.25); border:1px solid var(--line);
  }
  .modal-head{
    padding:18px 22px; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;
  }
  .modal-head h2{
    font-family:'Fraunces', serif; font-size:19px; margin:0; color:var(--pine-deep);
  }
  .modal-head .x{
    cursor:pointer; font-size:20px; color:var(--ink-soft); line-height:1; background:none; border:none;
  }
  .modal-body{ padding:20px 22px; }
  .modal-foot{
    padding:16px 22px; border-top:1px solid var(--line);
    display:flex; justify-content:flex-end; gap:10px;
  }

  .detail-img{
    width:100%; max-height:280px; object-fit:contain; background:var(--paper-deep);
    border:1px solid var(--line); border-radius:4px; margin-bottom:16px; display:block;
  }

  .field{ margin-bottom:13px; }
  .field label{
    display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:5px;
    font-weight:500; letter-spacing:.02em;
  }
  .field input, .field select, .field textarea{
    width:100%; padding:9px 11px; border:1px solid var(--line);
    border-radius:var(--radius); background:var(--paper); font-size:13.5px;
    font-family:inherit; color:var(--ink); outline:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--pine); background:var(--card); }
  .field .hint{ font-size:11px; color:var(--ink-soft); margin-top:4px; }
  .field .err{ font-size:11px; color:var(--red); margin-top:4px; display:none; }
  .field.has-err input{ border-color:var(--red); }
  .field.has-err .err{ display:block; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:0 12px; }

  .detail-grid{ display:grid; grid-template-columns:auto 1fr; gap:9px 14px; font-size:13px; }
  .detail-grid dt{ color:var(--ink-soft); }
  .detail-grid dd{ margin:0; font-family:'IBM Plex Mono', monospace; }

  #importSummary{
    margin-top:14px; padding:12px 14px; border-radius:var(--radius);
    background:var(--paper-deep); font-size:12.5px; display:none;
  }
  #importSummary.show{ display:block; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(12px);
    background:var(--pine-deep); color:#F4F0E2; padding:11px 20px; border-radius:var(--radius);
    font-size:13px; box-shadow:var(--shadow); opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease; z-index:100;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  #mobileToggle{ display:none; }
  @media (max-width: 860px){
    #sidebar{ position:fixed; left:-280px; top:0; z-index:40; transition:left .2s ease; box-shadow:0 0 40px rgba(0,0,0,0.3); }
    #sidebar.show{ left:0; }
    #mobileToggle{ display:inline-flex; }
    #grid{ padding:14px 16px 40px; }
    #topbar{ padding:14px 16px; }
    #crumb{ padding:14px 16px 0; }
    #siteFooter{ padding:22px 16px; }
  }
</style>
</head>
<body>
<div id="app">

  <aside id="sidebar">
    <div class="brand">
      <div class="eyebrow">Catalogo</div>
      <h1>Prodotti per animali</h1>
      <div class="sub">Sfoglia il catalogo per categoria</div>
    </div>
    <nav class="cat-nav" id="catNav"></nav>
    <div class="sidebar-foot">
      <div class="tally"><span>Categorie</span><span id="tallyCats" class="mono">0</span></div>
      <div class="tally"><span>Prodotti totali</span><span id="tallyProducts" class="mono">0</span></div>
    </div>
  </aside>

  <main id="main">
    <div id="topbar">
      <button class="btn" id="mobileToggle" aria-label="Categorie" onclick="document.getElementById('sidebar').classList.toggle('show')">☰</button>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="search" aria-label="Cerca prodotti" placeholder="Cerca per codice, codice a barre o nome prodotto…">
      </div>
    </div>

    <div id="crumb"></div>
    <div id="grid"></div>
    <p id="catalogStatus" role="status">Caricamento catalogo…</p>
    <div id="empty" style="display:none;">
      <h3>Nessun prodotto trovato</h3>
      <p>Prova a cambiare categoria o modifica la ricerca.</p>
    </div>

    <footer id="siteFooter">
      <div class="foot-brand">Prodotti per animali</div>
      <div class="foot-contacts">
        <a class="foot-item link" href="https://wa.me/393444141666" target="_blank" rel="noopener">
          <span class="ico"><svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.29-1.39a9.9 9.9 0 0 0 4.75 1.21h.01c5.46 0 9.9-4.45 9.9-9.91C21.96 6.45 17.5 2 12.04 2zm0 18.15h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.14.82.84-3.06-.2-.31a8.2 8.2 0 0 1-1.26-4.36c0-4.54 3.7-8.24 8.26-8.24 2.2 0 4.27.86 5.83 2.42a8.18 8.18 0 0 1 2.42 5.83c0 4.55-3.7 8.24-8.25 8.24zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.25-.64.81-.78.97-.15.16-.29.18-.54.06-.25-.12-1.04-.38-1.99-1.22-.73-.66-1.23-1.46-1.37-1.71-.15-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.15.16-.25.25-.41.08-.16.04-.31-.02-.43-.06-.12-.56-1.36-.77-1.86-.2-.48-.41-.42-.56-.43-.14-.01-.31-.01-.47-.01-.16 0-.43.06-.66.31-.23.25-.86.85-.86 2.08 0 1.23.89 2.42 1.02 2.58.12.16 1.75 2.67 4.24 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.55.1.47-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.15-1.18-.06-.11-.23-.17-.48-.29z"/></svg></span>
          <span><span class="label">WhatsApp</span><span class="value">344 414 1666</span></span>
        </a>
        <a class="foot-item link" href="https://www.google.com/maps/search/?api=1&query=Via+Costanzo+Cantoni+22" target="_blank" rel="noopener">
          <span class="ico"><svg viewBox="0 0 24 24"><path d="M12 2C7.6 2 4 5.6 4 10c0 5.4 7 11.4 7.3 11.6.2.2.5.2.7 0C12.4 21.4 20 15.4 20 10c0-4.4-3.6-8-8-8zm0 10.8c-1.5 0-2.8-1.2-2.8-2.8S10.5 7.2 12 7.2s2.8 1.2 2.8 2.8-1.3 2.8-2.8 2.8z"/></svg></span>
          <span><span class="label">Indirizzo</span><span class="value">Via Costanzo Cantoni 22</span></span>
        </a>
      </div>
    </footer>
  </main>

</div>

<!-- Detail modal -->
<div class="overlay" id="detailOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="detailTitle">Dettagli prodotto</h2>
      <button class="x" onclick="closeModal('detailOverlay')">&times;</button>
    </div>
    <div class="modal-body">
      <img id="detailImg" class="detail-img" style="display:none;" alt="">
      <dl class="detail-grid" id="detailBody"></dl>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal('detailOverlay')">Chiudi</button>
    </div>
  </div>
</div>


<script>
(function(){
  "use strict";

  var state = {
    products: [],
    mainCat: null,
    subCat: null,
    search: ""
  };

  // ---------- category tree ----------
  function buildTree(products){
    var tree = {};
    products.forEach(function(p){
      var m = (p.main_cat || "").trim() || "Non categorizzato";
      var s = (p.sub_cat || "").trim() || "Altro";
      if(!tree[m]) tree[m] = {count:0, subs:{}};
      tree[m].count++;
      tree[m].subs[s] = (tree[m].subs[s]||0)+1;
    });
    return tree;
  }

  function renderSidebar(){
    var tree = buildTree(state.products);
    var mains = Object.keys(tree).sort(function(a,b){
      if(a==="Non categorizzato") return 1;
      if(b==="Non categorizzato") return -1;
      return a.localeCompare(b,'it');
    });
    var nav = document.getElementById("catNav");
    nav.innerHTML = "";

    var allRow = document.createElement("div");
    allRow.className = "cat-row" + (state.mainCat===null ? " active":"");
    allRow.innerHTML = '<span class="name">Tutti i prodotti</span><span class="cat-count">'+state.products.length+'</span>';
    allRow.onclick = function(){ state.mainCat=null; state.subCat=null; render(); if(window.innerWidth<=860) document.getElementById('sidebar').classList.remove('show'); };
    nav.appendChild(allRow);

    mains.forEach(function(m){
      var item = document.createElement("div");
      item.className = "cat-item" + (state.mainCat===m ? " open":"");
      var row = document.createElement("div");
      row.className = "cat-row" + (state.mainCat===m && state.subCat===null ? " active":"");
      row.innerHTML = '<span class="chevron"></span><span class="name">'+escapeHtml(m)+'</span><span class="cat-count">'+tree[m].count+'</span>';
      row.onclick = function(ev){
        if(state.mainCat===m){
          item.classList.toggle("open");
        } else {
          state.mainCat = m; state.subCat = null;
          item.classList.add("open");
        }
        render();
        if(window.innerWidth<=860) document.getElementById('sidebar').classList.remove('show');
      };
      item.appendChild(row);

      var subList = document.createElement("div");
      subList.className = "sub-list";
      var subs = Object.keys(tree[m].subs).sort(function(a,b){ return a.localeCompare(b,'it'); });
      subs.forEach(function(s){
        var subRow = document.createElement("div");
        subRow.className = "sub-row" + (state.mainCat===m && state.subCat===s ? " active":"");
        subRow.innerHTML = '<span>'+escapeHtml(s)+'</span><span class="mono">'+tree[m].subs[s]+'</span>';
        subRow.onclick = function(ev){
          ev.stopPropagation();
          state.mainCat = m; state.subCat = s;
          render();
          if(window.innerWidth<=860) document.getElementById('sidebar').classList.remove('show');
        };
        subList.appendChild(subRow);
      });
      item.appendChild(subList);
      nav.appendChild(item);
    });

    document.getElementById("tallyCats").textContent = mains.length;
    document.getElementById("tallyProducts").textContent = state.products.length;
  }

  function filteredProducts(){
    var q = state.search.trim().toLowerCase();
    return state.products.filter(function(p){
      if(state.mainCat !== null){
        var m = (p.main_cat||"").trim() || "Non categorizzato";
        if(m !== state.mainCat) return false;
        if(state.subCat !== null){
          var s = (p.sub_cat||"").trim() || "Altro";
          if(s !== state.subCat) return false;
        }
      }
      if(q){
        var hay = [p.code,p.barcode,p.name].join(" ").toLowerCase();
        if(hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function renderCrumb(list){
    var crumb = document.getElementById("crumb");
    var parts = [];
    if(state.mainCat===null){ parts.push("<b>Tutti i prodotti</b>"); }
    else{
      parts.push("<b>"+escapeHtml(state.mainCat)+"</b>");
      if(state.subCat) parts.push("› "+escapeHtml(state.subCat));
    }
    crumb.innerHTML = parts.join(" ") + ' <span class="count-badge">'+list.length+' articoli</span>';
  }


  const photoRequests = new Map();
  async function showPhoto(img, product) {
    const photo = product.photo;
    img.removeAttribute("src");
    img.style.display = photo ? "block" : "none";
    img.alt = photo ? product.name : "";
    img.dataset.code = product.code;
    if (!photo) return;
    const url = new URL(photo, new URL("catalogo/", location.href));
    try {
      let src = url.href;
      if (url.pathname.endsWith(".json")) {
        if (!photoRequests.has(src)) {
          photoRequests.set(src, fetch(url).then(response => {
            if (!response.ok) throw new Error("Foto non disponibile");
            return response.json();
          }).catch(error => { photoRequests.delete(src); throw error; }));
        }
        const encoded = (await photoRequests.get(src))[product.code];
        if (!encoded) throw new Error("Foto non disponibile");
        src = "data:image/webp;base64," + encoded;
      }
      if (img.dataset.code === product.code) img.src = src;
    } catch (error) {
      if (img.dataset.code === product.code) img.style.display = "none";
    }
  }

  function renderGrid(limit = 48){
    var list = filteredProducts();
    renderCrumb(list);
    var grid = document.getElementById("grid");
    var empty = document.getElementById("empty");
    grid.innerHTML = "";
    if(list.length===0){
      empty.style.display = "block";
      return;
    }
    empty.style.display = "none";
    var frag = document.createDocumentFragment();
    list.slice(0, limit).forEach(function(p){
      var idx = state.products.indexOf(p);
      var card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        '<div class="tab"><span>'+escapeHtml((p.main_cat||"Non categorizzato"))+'</span></div>'+
        '<div class="body">'+
          '<img class="thumb-img" loading="lazy" decoding="async" alt="" onerror="this.style.display=\'none\'">'+
          '<div class="row1"><span class="code">'+escapeHtml(p.code)+'</span></div>'+
          '<div class="name">'+escapeHtml(p.name||"(senza nome)")+'</div>'+
          '<div class="meta">'+
            '<span class="chip">'+escapeHtml(p.sub_cat||"Altro")+'</span>'+
            (p.pack ? '<span class="chip">Conf. '+escapeHtml(String(p.pack))+'</span>' : '')+
            (p.box ? '<span class="chip">Cartone '+escapeHtml(String(p.box))+'</span>' : '')+
          '</div>'+
        '</div>';
      showPhoto(card.querySelector("img"), p);
      card.tabIndex = 0;
      card.setAttribute("role", "button");
      card.onclick = function(){ openDetail(idx); };
      card.onkeydown = function(event){
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openDetail(idx);
        }
      };
      frag.appendChild(card);
    });
    grid.appendChild(frag);
    if (list.length > limit) {
      const more = document.createElement("button");
      more.className = "btn";
      more.textContent = "Mostra altri prodotti (" + (list.length - limit) + ")";
      more.onclick = () => {
        renderGrid(limit + 48);
        grid.children[limit]?.focus();
      };
      grid.appendChild(more);
    }
  }

  function render(){
    renderSidebar();
    renderGrid();
  }

  function openDetail(idx){
    var p = state.products[idx];
    if(!p) return;
    document.getElementById("detailTitle").textContent = p.name || "Dettagli prodotto";
    var img = document.getElementById("detailImg");
    img.onerror = function(){ img.style.display = "none"; };
    showPhoto(img, p);
    var rows = [
      ["Codice", p.code],
      ["Codice a barre", p.barcode||"—"],
      ["Nome prodotto", p.name||"—"],
      ["Categoria", p.main_cat||"Non categorizzato"],
      ["Sottocategoria", p.sub_cat||"Altro"],
      ["Pezzi/confezione", p.pack||"—"],
      ["Pezzi/cartone", p.box||"—"]
    ];
    document.getElementById("detailBody").innerHTML = rows.map(function(r){
      return "<dt>"+r[0]+"</dt><dd>"+escapeHtml(r[1])+"</dd>";
    }).join("");
    openModal("detailOverlay");
  }

  // ---------- Modal helpers ----------
  function openModal(id){ document.getElementById(id).classList.add("show"); }
  function closeModal(id){ document.getElementById(id).classList.remove("show"); }
  window.closeModal = closeModal;
  document.querySelectorAll(".overlay").forEach(function(ov){
    ov.addEventListener("click", function(e){ if(e.target===ov) closeModal(ov.id); });
  });

  // ---------- Search ----------
  var searchTimer = null;
  document.getElementById("searchInput").addEventListener("input", function(e){
    clearTimeout(searchTimer);
    var val = e.target.value;
    searchTimer = setTimeout(function(){
      state.search = val;
      renderGrid();
    }, 120);
  });

  // ---------- init ----------
  const status = document.getElementById("catalogStatus");
  const search = document.getElementById("searchInput");
  search.disabled = true;
  fetch("catalogo/prodotti.json", {cache: "no-cache"})
    .then(response => {
      if (!response.ok) throw new Error("Catalogo non disponibile");
      return response.json();
    })
    .then(products => {
      if (!Array.isArray(products) || !products.length) throw new Error("Catalogo vuoto");
      state.products = products;
      render();
      status.hidden = true;
      search.disabled = false;
    })
    .catch(() => { status.textContent = "Catalogo temporaneamente non disponibile. Ricarica la pagina per riprovare."; });

})();
</script>
</body>
</html>
